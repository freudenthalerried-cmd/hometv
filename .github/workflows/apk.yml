name: Fire TV APK
on:
  push:
    paths: ['**', '!content.json', '!README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleRelease --no-daemon
      - run: |
          cp app/build/outputs/apk/release/app-release.apk AbendKino.apk
          python3 -c 'import json,os; m=(os.environ.get("MSG") or "").splitlines(); print(json.dumps({"versionCode": int(os.environ["N"]), "notes": m[0] if m else ""}, ensure_ascii=False))' > version.json
          cat version.json
        env:
          N: ${{ github.run_number }}
          MSG: ${{ github.event.head_commit.message }}
      - uses: actions/upload-artifact@v4
        with: { name: AbendKino, path: AbendKino.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: firetv
          name: AbendKino (Fire TV)
          make_latest: false
          files: |
            AbendKino.apk
            version.json
          body: |
            Fire-TV-App HomeTV
            Direkt-Link: https://github.com/${{ github.repository }}/releases/download/firetv/AbendKino.apk
