  contentVer = +c.version || 0;
  return true;
}
function loadContent() {
  http(UPD + 'content.json').then(function (t) {
    var c = JSON.parse(t);
    if (+c.version > contentVer && applyContent(c)) { save('content', c); toast('Neue Inhalte geladen (v' + contentVer + ')'); logUpd('Neue Inhalte geladen (v' + contentVer + ')'); }
  }).catch(function () { });
}

/* ---------- PIN lock (4 arrow keys, the remote has no digits) ---------- */
var lockOn = false, lockBuf = [], pinSet = false;
var ARW = {ArrowUp:'▲', ArrowDown:'▼', ArrowLeft:'◀', ArrowRight:'▶'};
function showLock(setMode) {
  lockOn = true; lockBuf = []; pinSet = setMode;
  $('ltitle').textContent = setMode ? 'Neuen Code festlegen' : 'HomeTV ist gesperrt';
  $('ldots').textContent = '';
  $('lock').style.display = 'flex';
}
function hideLock() { lockOn = false; $('lock').style.display = 'none'; }
function lockKey(k) {
  if (!ARW[k]) return;
  lockBuf.push(k);
  $('ldots').textContent = lockBuf.map(function (x) { return pinSet ? ARW[x] : '●'; }).join(' ');
  if (lockBuf.length < 4) return;
  if (pinSet) {
    save('pin', lockBuf);
    toast('Code gespeichert: ' + lockBuf.map(function (x) { return ARW[x]; }).join(' '));
    hideLock(); settings();
  } else if (lockBuf.join() === load('pin', []).join()) hideLock();
  else { lockBuf = []; setTimeout(function () { $('ldots').textContent = ''; }, 300); toast('Falscher Code'); }
}

function homeRows(cb) {
  var specs = [
    ['Für dich', {fy:1}],
    ['Top dieser Woche', {order:'top-weekly'}],
    ['Bestbewertet', {order:'top-rated', page:rnd(5)}],
    ['Trend des Monats', {order:'top-monthly', page:rnd(2)}]
  ].concat(catPick(3).map(function (c) { return [c[0], {query:c[1], order:'top-rated', page:rnd(3)}]; }))
   .concat([['Neu', {order:'latest'}]]);
  Promise.all(specs.map(function (j) { return moreFn(j[1])(1); })).then(function (res) {
    cb(specs.map(function (j, i) { return [j[0], res[i].slice(0, 30), j[1]]; }).filter(function (r) { return r[1].length; }));
  });
}
function personalLight(list) {
  // keep API order mostly, but lift what matches the taste and push watched ones back
  return list.map(function (v, i) { return {v:v, s:-i * 0.08 + affinity(v) - (P.watched[v.id] ? 4 : 0)}; })
    .sort(function (a, b) { return b.s - a.s; }).map(function (x) { return x.v; });
}
function drawRows(rows) {
  begin();
  rows.forEach(function (r) { addRow(r[0], r[1], null, r[2]); });
  if (!rows.length) msg('Keine Verbindung – bitte Internet prüfen und mit OK auf „Start“ neu laden.');
  finish();
}
function home() {
  var lt = load('lastTest', null);
  if (!lt || Date.now() - lt[0] > 864e5) setTimeout(runTest, 8000);
  var cache = load('cache_home', null);
  moved = false;
  if (cache && cache.length) drawRows(cache); else { begin(); msg('Lade die besten Filme …'); finish(); }
  homeRows(function (rows) {
    var slimRows = rows.map(function (r) { return [r[0], r[1].map(slim), r[2]]; });
    save('cache_home', slimRows);
    if (view === 'home' && (!moved || !cache)) drawRows(rows);
  });
}
function cats() {
  begin();
  for (var i = 0; i < CATS.length; i += 6) addRow(i ? '' : 'Kategorien', CATS.slice(i, i + 6), 'cat');
  finish();
}
function openCat(c) {
  view = 'cat';
  begin(); msg('Lade ' + c[0] + ' …'); finish();
  var sp = [{query:c[1], order:'top-rated', page:rnd(2)}, {query:c[1], order:'top-weekly'},
    {query:c[1], order:'most-popular'}, {query:c[1], order:'latest'}];
  Promise.all(sp.map(api)).then(function (r) {
    if (view !== 'cat') return;
    begin();
    addRow(c[0] + ' – passend für dich', personal(r[0].concat(r[1], r[2])).slice(0, 30), null, sp[0]);
    addRow(c[0] + ' – Bestbewertet', r[0], null, sp[0]);
    addRow(c[0] + ' – Diese Woche', r[1], null, sp[1]);
    addRow(c[0] + ' – Beliebt', r[2], null, sp[2]);
    addRow(c[0] + ' – Neu', r[3], null, sp[3]);
    if (lines.length < 2) msg('Nichts gefunden.');
    finish();
  });
}
function search() {
  begin();
  var r = document.createElement('div'); r.className = 'row'; r.style.height = '12vh';
  r.innerHTML = '<h2>Sprachsuche: OK drücken, dann 🎤-Taste gedrückt halten und sprechen (oder tippen)</h2>' +
    '<input id="q" class="f" type="search" placeholder="z. B. „Tatort“, „Komödie mit Til Schweiger“, „Zufall“, „Würfel spielen“ …">';
  $('rows').appendChild(r);
  var inp = r.querySelector('input');
  inp._act = function () { inp.focus(); A.keyboard(); };
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && inp.value.trim()) { e.stopPropagation(); e.preventDefault(); inp.blur(); doCommand(inp.value.trim()); }
  });
  lines.push({el:r, items:[inp], i:0});
  finish();
}
// ⏪ anywhere (outside the player): jump into the voice search with the keyboard open
function voiceSearch() {
  go('search'); L = 1; focus();
  var inp = lines[1].items[0]; inp.value = ''; inp.focus(); A.keyboard();
}

/* Spoken or typed commands: games, random film, categories, film rows; otherwise search everywhere. */
var GAME_WORDS = [[/würfel/, 'dice'], [/wahrheit|pflicht/, 'tod'], [/karte/, 'cards'], [/noch nie/, 'never'],
  [/stellung|roulette/, 'pos'], [/massage/, 'massage'], [/wer würde|eher/, 'wwe'], [/lieber/, 'wyr'], [/rolle/, 'role'],
  [/quiz/, 'quiz'], [/geschichte|interaktiv|story/, 'story'], [/wunsch|abgleich/, 'yesno'], [/date/, 'date'], [/challenge|woche/, 'week'], [/weißt du noch|erinnerung/, 'memory'],
  [/nähe|tiefe|fragen/, 'deep']];
// word list instead of \b: \b treats umlauts as word breaks ("komödie" would lose "die")
var FILLER = {zeig:1, zeige:1, mir:1, uns:1, spiel:1, spiele:1, start:1, starte:1, such:1, suche:1, nach:1, bitte:1, ein:1, eine:1,
  einen:1, der:1, die:1, das:1, den:1, dem:1, mit:1, von:1, kategorie:1, film:1, filme:1, abspielen:1, öffne:1, ich:1, will:1, möchte:1, sehen:1};
function doCommand(text) {
  var q = text.toLowerCase().replace(/[.!?,]/g, ' ').replace(/\s+/g, ' ').trim();
  if (/favorit|meine sendung/.test(q)) return go('fav');
  if (/lern|schule|erklär/.test(q)) return go('learn');
  if (/nachricht|news|zib|tagesschau|servus/.test(q)) return go('news');
  if (/wetter|uhrzeit/.test(q)) return go('dash');
  if (/comedy|kabarett|lustig|witz|satire/.test(q)) return go('comedy');
  if (/netflix|prime|disney|joyn|app\b/.test(q)) {
    var ap = myApps().filter(function (a) { return q.indexOf(a[0].toLowerCase().split(' ')[0]) >= 0; })[0];
    if (ap) return A.launch(ap[1]);
  }
  if (/kamin|feuer|natur|entspann/.test(q)) return go('relax');
  if (/youtube/.test(q)) return go('yt');
  if (/radio|sender|musik|jazz|lounge|klassik/.test(q) || allStations().some(function (st) { return q === st[0].toLowerCase(); })) {
    var st = allStations().filter(function (x) { return q.indexOf(x[0].toLowerCase()) >= 0; })[0];
    if (st) playRadio(st);
    return go('radio');
  }
  if (/^privat/.test(q)) return go('priv');
  if (!unlocked) return doSearch(q.split(' ').filter(function (w) { return !FILLER[w]; }).join(' ') || q, null, true);
  if (/zufall|überrasch|irgendwas/.test(q)) return randomPlay();
  if (/spiel/.test(q)) {
    for (var i = 0; i < GAME_WORDS.length; i++) if (GAME_WORDS[i][0].test(q)) return Games.open(GAME_WORDS[i][1]);
    return go('games');
  }
  if (/^(start|startseite|home)$/.test(q)) return go('home');
  if (/^(einstellungen|meine liste)$/.test(q)) return go(q === 'meine liste' ? 'mine' : 'set');
  var rest = q.split(' ').filter(function (w) { return !FILLER[w]; }).join(' ') || q;
  var cat = CATS.filter(function (c) { return c[0].toLowerCase() === rest || c[1] === rest; })[0];
  if (cat && !/film/.test(q)) { learnCat(cat); return openCat(cat); }
  var row = MV_ROWS.filter(function (r) { return r[0].toLowerCase().indexOf(rest) >= 0 || r[1].q === rest; })[0];
  doSearch(rest, row ? row[1] : null, /film|tatort|krimi|komödie|drama|doku/.test(q));
}
// searches the Mediathek films and the adult sources; films first when the words point to normal films
function doSearch(q, mvRow, filmsFirst) {
  save('lastq', q);
  var adult = unlocked;
  if (!adult) filmsFirst = true;
  else if (!filmsFirst) { P.tags[q.toLowerCase()] = (P.tags[q.toLowerCase()] || 0) + 0.5; save('profile', P); }
  toast('Suche „' + q + '“ …');
  var sp = [{query:q, order:'top-rated'}, {query:q, order:'most-popular'}, {query:q, order:'latest'}];
  var mv = Object.assign({mv:1, page:1}, mvRow || {q:q, f:TTD, min:3600});
  var none = function () { return Promise.resolve([]); };
  Promise.all((adult ? sp.map(api) : [none(), none(), none()]).concat([movies(mv)]))
    .then(function (r) {
      if (view !== 'search') return;
      while (lines.length > 2) { lines.pop().el.remove(); }
      [].slice.call($('rows').querySelectorAll('.msg')).forEach(function (m) { m.remove(); });
      if (filmsFirst) addRow('Filme: „' + q + '“', r[3], null, mv);
      addRow('Treffer – für dich sortiert', personal(r[0].concat(r[1])).slice(0, 40), null, sp[0]);
      addRow('Beliebt', r[1], null, sp[1]);
      addRow('Neu', r[2], null, sp[2]);
      if (!filmsFirst) addRow('Filme: „' + q + '“', r[3], null, mv);
      if (lines.length < 3) msg('Nichts gefunden.');
      L = Math.min(2, lines.length - 1); focus();
    });
}
function mine() {
  begin();
  addRow('Meine Liste (☰ zum Entfernen)', P.favs);
  addRow('Zuletzt angesehen', P.hist);
  if (lines.length < 2) msg('Noch leer. Mit der Menü-Taste ☰ merkst du dir Filme.');
  finish();
}
/* ---------- self update ---------- */
var UPD = 'https://github.com/freudenthalerried-cmd/hometv/releases/download/firetv/';
var newVer = 0, updOn = false;
function showUpd(notes) {
  $('uh').textContent = 'Neue Version v' + newVer + ' verfügbar';
  $('un').textContent = notes || 'Verbesserungen und Fehlerbehebungen.';
  $('upd').style.display = 'flex'; updOn = true;
}
function hideUpd() { $('upd').style.display = 'none'; updOn = false; }
function curVer() { return A.version ? A.version() : 0; }
var playingNow = false;
function autoUpd() { return load('autoUpd', true); }
function startUpdate(notes) {
  save('updNotes', [newVer, notes || '']);
  logUpd('Update v' + newVer + ' wird geladen' + (notes ? ': ' + notes : ''));
  A.update(UPD + 'AbendKino.apk');
}
function checkUpdate(manual) {
  http(UPD + 'version.json').then(function (t) {
    var j = JSON.parse(t);
    newVer = +j.versionCode || 0;
    var fresh = load('updSeen', 0) < newVer;
    // automatic mode tries again at every check until it is installed; popup mode asks once per version
    if (newVer > curVer() && A.update && !lockOn && (manual || ((fresh || autoUpd()) && !playingNow))) {
      save('updSeen', newVer);
      if (manual || autoUpd()) { toast('Update v' + newVer + ' wird automatisch installiert …'); startUpdate(j.notes); }
      else showUpd(j.notes);
    } else if (newVer > curVer()) toast('Update verfügbar – Einstellungen → Jetzt aktualisieren');
    else if (manual) toast('AbendKino ist aktuell (v' + curVer() + ')');
    logUpd(newVer > curVer() ? 'Update v' + newVer + ' gefunden' : 'Geprüft: aktuell (v' + curVer() + ')');
    if (view === 'set') settings();
    if (view === 'log') updLogView();
  }).catch(function () { logUpd('Update-Prüfung fehlgeschlagen (kein Internet?)'); if (manual) toast('Update-Prüfung fehlgeschlagen'); });
}
window.onUpdate = function (st) {
  var m = {permission:'Bitte „Unbekannte Apps installieren“ für AbendKino erlauben – danach läuft es automatisch',
    install:'Bitte „Installieren“ drücken …', error:'Download fehlgeschlagen'}[st];
  if (m) logUpd(m);
  toast(m || 'Update lädt … ' + st);
};
var RESET_AT = 127; // raise when the adult checks change so much that old "does not work" marks are wrong
// a new version is running: note it in the log once
(function () {
  var v = curVer(), last = load('lastVer', 0);
  if (v && v !== last) {
    // new version: every source on again, fresh rows; lists made with older (worse) logic are thrown away once
    srcOn = {}; srcStats = {}; save('sources', srcOn); save('srcStats', srcStats); save('cache_home', null);
    if (load('resetAt', 0) < RESET_AT) {
      P.bad = {}; adultOk = {}; save('profile', P); save('adultOk', adultOk); save('resetAt', RESET_AT);
    }
    var n = load('updNotes', [0, '']);
    if (last) logUpd('Installiert: v' + v + (n[0] === v && n[1] ? ' – ' + n[1] : ''));
    save('lastVer', v);
  }
})();

function settings() {
  var keep = view === 'set' && lines[L] ? [L, lines[L].i] : null; // stay on the toggled button
  begin();
  var strict = A.load('strict') !== '0';
  var tt = topTags(12), disc = load('disc', false), ml = MIN_SEC / 60, pin = load('pin', []).length === 4;
  addRow('Version v' + curVer() + ' · Inhalte v' + contentVer + (newVer > curVer() ? ' – Update auf v' + newVer + ' verfügbar' : ''), [
    ['Nach Update suchen', function () { checkUpdate(true); }],
    [(autoUpd() ? '● ' : '○ ') + 'Automatisch installieren', function () { save('autoUpd', !autoUpd()); settings(); }],
    ['📋 Update-Protokoll', function () { go('log'); }]], 'btn');
  wxLocRow();
  if (unlocked) {
  addRow('Privat-Videos' + (verified ? ' · Geprüft-Liste: ' + verified.v.filter(function (x) { return srcIsOn(x.src); }).length + ' Videos vom ' + new Date(verified.t).toLocaleDateString('de-AT') : ''), [
    [(onlyVerified ? '● ' : '○ ') + 'Nur geprüfte Videos (100 % getestet)', function () { onlyVerified = true; save('onlyVerified', true); save('cache_home', null); settings(); }],
    [(!onlyVerified ? '● ' : '○ ') + 'Alle Videos (mehr Auswahl, ungeprüft)', function () { onlyVerified = false; save('onlyVerified', false); save('cache_home', null); settings(); }]], 'btn');
  addRow('Werbeblocker', [[(strict ? '● Streng (empfohlen)' : '○ Streng'), function () { A.save('strict', '1'); toast('Werbeblocker: streng'); settings(); }],
    [(!strict ? '● Normal (falls Videos nicht starten)' : '○ Normal (falls Videos nicht starten)'), function () { A.save('strict', '0'); toast('Werbeblocker: normal'); settings(); }]], 'btn');
  addRow('Quellen (mehr Quellen = mehr Filme)', Object.keys(SRC).map(function (k) {
    return [(srcIsOn(k) ? '● ' : '○ ') + SRC[k].name, function () {
      srcOn[k] = !srcIsOn(k);
      if (!activeSrc().length) srcOn[k] = true;
      save('sources', srcOn); save('cache_home', null); settings();
    }];
  }), 'btn');
  var sum = load('srcSum', {}), fb = load('fbLog', []);
  var lt = load('lastTest', null);
  addRow('Selbsttest: prüft alle Videos auf diesem Gerät und blendet nicht funktionierende aus' + (lt ? ' · zuletzt ' + new Date(lt[0]).toLocaleDateString('de-AT') + ': ' + lt[1] + ' ✓ ' + lt[2] + ' ✗' : ''),
    [['🧪 Selbsttest starten', function () { go('selftest'); }]], 'btn');
  addRow('Quellen-Statistik (läuft ✓ / geht nicht ✗) – ☰ „Geht nicht“ zählt mit', Object.keys(SRC).map(function (k) {
    var x = sum[k] || [0, 0]; return [SRC[k].name + '  ' + x[0] + ' ✓  ' + x[1] + ' ✗' + (srcOn[k] === false ? ' (aus)' : ''), function () { }];
  }).concat(fb.length ? [['Gemeldet: ' + fb.length + ' (zuletzt: ' + String(fb[0][2]).slice(0, 30) + ')', function () { }]] : []), 'btn');
  addRow('Filme', [[(disc ? '● ' : '○ ') + 'Diskret-Modus', function () {
      save('disc', !disc); document.body.classList.toggle('disc', !disc); settings(); }]]
    .concat([10, 20, 30].map(function (m) {
      return [(ml === m ? '● ' : '○ ') + 'ab ' + m + ' min', function () {
        save('minlen', m); MIN_SEC = m * 60; save('cache_home', null); toast('Nur Filme ab ' + m + ' Minuten'); settings(); }];
    })), 'btn');
  }
  addRow('Sperre & Timer', [
    [pin ? 'PIN ändern' : 'PIN festlegen', function () { showLock(true); }],
    ['PIN entfernen', function () { save('pin', []); toast('PIN entfernt'); settings(); }],
    ['Sleep-Timer: ' + (sleepMin ? sleepMin + ' min' : 'aus'), function () {
      sleepMin = {0:30, 30:60, 60:90, 90:0}[sleepMin];
      if (A.sleep) A.sleep(sleepMin);
      toast(sleepMin ? 'App schließt in ' + sleepMin + ' Minuten' : 'Sleep-Timer aus'); settings(); }]], 'btn');
  if (unlocked) addRow('Gelernte Vorlieben: ' + (tt.length ? tt.join(', ') : 'noch keine'), [['Vorlieben zurücksetzen', function () { P.tags = {}; save('profile', P); toast('Zurückgesetzt'); settings(); }],
    ['Ausgeblendete wieder zeigen (' + (Object.keys(P.bad).length + Object.keys(pat).filter(function (k) { return patBad('https://' + k); }).length) + ')', function () {
      P.bad = {}; mvOk = {}; srcStats = {}; pat = {}; save('profile', P); save('mvOk', {}); save('srcStats', {}); save('pat', {}); toast('Alle Videos wieder sichtbar'); settings(); }],
    ['Verlauf löschen', function () { P.hist = []; P.watched = {}; save('profile', P); toast('Verlauf gelöscht'); settings(); }]], 'btn');
  addRow('Steuerung', [['OK: abspielen/pause'], ['◀ ▶: ±15 s'], ['▲ ▼: ±2 min'], ['Zurück: Player schließen'], ['⏪: Sprachsuche'], ['☰: Ähnliche · Merken']], 'btn');
  finish();
  if (keep && lines[keep[0]]) { L = keep[0]; lines[L].i = keep[1]; focus(); }
}

var sleepMin = 0;
Games.init();
applyContent(load('content', null));
loadContent();
loadVerified();
if (load('disc', false)) document.body.classList.add('disc');
go('dash');
if (load('pin', []).length === 4) showLock(false);
setTimeout(function () { checkUpdate(false); }, 4000);
setInterval(function () { loadContent(); loadVerified(); checkUpdate(false); }, 6 * 3600e3); // the app often stays open for days
</script>
